# SCD Type 6: SCD2 with Current Value Columns
#
# SCD6 is a hybrid that combines:
# - SCD2 row versioning (__valid_from, __valid_to, __is_current)
# - Current value columns (current_*) backfilled to ALL rows
#
# This enables efficient reporting without self-joins.
# Example: "Show me historical transactions with the customer's CURRENT city"

table_name: gold.dim_customer
table_type: dimension
scd_type: 6

keys:
  surrogate_key: customer_sk
  natural_keys: [customer_id]

# Columns to track for version changes (triggers new row)
track_history_columns:
  - first_name
  - last_name
  - email
  - city
  - state
  - status

# Columns to backfill as current_* on all historical rows
# These are the columns you want to see "current values" for in reports
current_value_columns:
  - city
  - state
  - status

# Business effective date column
effective_at: updated_at

# Surrogate key strategy

sources:
  - name: silver.customers
    cdc_strategy: cdf
    primary_keys: [customer_id]

transformation_sql: |
  SELECT 
    customer_id,
    first_name,
    last_name,
    email,
    city,
    state,
    status,
    updated_at
  FROM silver_customers

table_description: >
  SCD Type 6 customer dimension: full history rows plus backfilled
  current_* columns so reports can show a transaction against the
  customer's current address/status without self-joins.
column_descriptions:
  customer_id: Stable CRM customer identifier.
  first_name: Person first name as of this version.
  last_name: Person last name as of this version.
  email: Customer email address; PII, tokenized downstream.
  city: City as of this version; current_city carries the backfilled value.
  state: State/province as of this version; current_state carries the backfilled value.
  status: Lifecycle status as of this version; current_status carries the backfilled value.
  updated_at: Supplier business-effective timestamp for this version.
