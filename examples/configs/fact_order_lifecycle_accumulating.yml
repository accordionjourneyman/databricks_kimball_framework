table_name: demo_gold.fact_order_lifecycle
table_type: fact
merge_keys: [order_id]
grain: one order lifecycle
fact_pattern: accumulating_snapshot
milestones:
  - name: ordered
    column: ordered_at
    order: 1
  - name: shipped
    column: shipped_at
    order: 2
  - name: delivered
    column: delivered_at
    order: 3
sources:
  - name: silver.order_events
    alias: orders
    primary_keys: [order_id]
table_description: >
  Accumulating-snapshot fact tracking each order through its lifecycle
  milestones (ordered -> shipped -> delivered); milestone timestamps fill in
  as events arrive.
column_descriptions:
  order_id: Parent business order identifier; the fact's grain and merge key.
  ordered_at: Milestone timestamp when the order was placed.
  shipped_at: Milestone timestamp when the order shipped; NULL until shipped.
  delivered_at: Milestone timestamp when the order was delivered; NULL until delivered.
transformation_sql: |
  SELECT order_id, ordered_at, shipped_at, delivered_at
  FROM silver.order_events
