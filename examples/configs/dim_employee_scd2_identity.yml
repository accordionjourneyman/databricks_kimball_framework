table_name: {{ target.gold_schema }}.dim_employee
table_type: dimension
scd_type: 2
keys:
  surrogate_key: employee_sk
  natural_keys: [employee_id]

# Use Identity Columns (requires Databricks Runtime with Identity Column support)

track_history_columns:
  - department
  - title
  - manager_id

# Business-time SCD2: Use source timestamp for __valid_from/__valid_to instead of processing time
# If not set, defaults to processing time (__etl_processed_at)
effective_at: updated_at

default_rows:
  "-1": "Unknown"

sources:
  - name: {{ target.silver_schema }}.employees
    alias: e
    cdc_strategy: cdf
    primary_keys: [employee_id]  # Required for CDF deduplication

transformation_sql: |
  SELECT
    e.employee_id,
    e.first_name,
    e.last_name,
    e.department,
    e.title,
    e.manager_id,
    e.updated_at
  FROM e

table_description: Type 2 employee dimension with Delta identity-column surrogate keys.
column_descriptions:
  employee_id: Stable HR employee identifier shared by all versions.
  first_name: Person first name as of this version.
  last_name: Person last name as of this version.
  department: Department as of this version; changes start a new row.
  title: Job title as of this version; changes start a new row.
  manager_id: Reporting manager's employee_id as of this version.
  updated_at: Supplier business-effective timestamp for this version.

audit_columns: true
