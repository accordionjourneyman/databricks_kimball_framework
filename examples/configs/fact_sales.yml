table_name: {{ target.gold_schema }}.fact_sales
table_type: fact
depends_on:
  - {{ target.gold_schema }}.dim_customer
  - {{ target.gold_schema }}.dim_product
  - {{ target.gold_schema }}.dim_employee

# Merge keys: degenerate dimension used for MERGE condition (Kimball: facts have no SK)
merge_keys: [order_item_id]

# Brokered customer keys are resolved before the fact is written.
foreign_keys:
  - column: customer_sk
    references: {{ target.gold_schema }}.dim_customer
    dimension_key: customer_sk
    relationship: type7
    durable_column: customer_dk
    durable_dimension_key: customer_dk
    lookup:
      source_columns: [customer_id]
      event_time: order_date
      early_arriving: skeleton
  - column: product_sk
    references: {{ target.gold_schema }}.dim_product
  - column: employee_sk
    references: {{ target.gold_schema }}.dim_employee

# Enable schema evolution to automatically handle new columns
schema_evolution: true

# Intentional modeling decision, recorded per docs/adr/ADR-003-schema-model-integrity.md:
# customer_id means "broker lookup input" here, not the customer's stable
# attribute semantics; the drift from the customer dimension is waived.
modeling_exceptions:
  - code: COLUMN_SEMANTICS_CONFLICT
    columns: [customer_id]
    reason: >
      customer_id on the fact is the broker's lookup input, intentionally
      narrower than the dimension attribute's meaning.
    decision_ref: docs/adr/ADR-003-model-integrity-validator.md

# Liquid Clustering for optimal fact table queries
# Cluster by primary foreign keys and date for best query performance
cluster_by: [customer_sk, order_date]
optimize_after_merge: true

sources:
  - name: {{ target.silver_schema }}.order_items
    alias: oi
    cdc_strategy: cdf
    primary_keys: [order_item_id]  # Required for CDF deduplication
  - name: {{ target.silver_schema }}.orders
    alias: o
    cdc_strategy: cdf
    primary_keys: [order_id]  # Required for CDF deduplication
  - name: {{ target.gold_schema }}.dim_product
    alias: p
    cdc_strategy: full
  - name: {{ target.gold_schema }}.dim_employee
    alias: e
    cdc_strategy: full

transformation_sql: |
  SELECT
    oi.order_item_id,
    o.order_id,
    o.customer_id,
    p.product_sk,
    e.employee_sk,
    o.order_date,
    oi.quantity,
    oi.sales_amount,
    (oi.sales_amount - (p.unit_cost * oi.quantity)) as net_profit
  FROM oi
  JOIN o ON oi.order_id = o.order_id
  -- Customer SK/DK are added by the centralized key broker.
  -- Point-in-time lookup for Employee (SCD2)
  LEFT JOIN e ON o.employee_id = e.employee_id
             AND o.order_date >= e.__valid_from
             AND o.order_date < e.__valid_to
  -- Current lookup for Product (SCD1)
  LEFT JOIN p ON oi.product_id = p.product_id

table_description: >
  Transaction-grain sales fact: one row per order item, with brokered
  type7 customer keys and point-in-time employee dimension capture.
column_descriptions:
  order_item_id: Degenerate dimension; the source line-item identifier.
  order_id: Parent business order identifier; the fact's grain and merge key.
  customer_id: Source customer identifier consumed by the key broker.
  product_sk: Surrogate key of the current product (SCD1 lookup).
  employee_sk: Surrogate key of the employee version effective at order time.
  order_date: Business date of the order; clustered with customer_sk.
  quantity: Additive measure, units sold on this line item.
  sales_amount: Additive measure, gross revenue for this line item.
  net_profit: Additive measure, sales minus standard cost for this line item.

audit_columns: true
