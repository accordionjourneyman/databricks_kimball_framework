name: Generate Schema

on:
  push:
    branches: [main]
    paths:
      - "src/kimball/common/**"
      - "src/kimball/contracts/**"
      - "tools/generate_schema.py"
      - "schemas/pipeline-config.schema.json"
  pull_request:
    paths:
      - "src/kimball/common/**"
      - "src/kimball/contracts/**"
      - "tools/generate_schema.py"
      - "schemas/pipeline-config.schema.json"
      - "schemas/pipeline-config.schema.json"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          pip install -e .

      - name: Generate schema
        run: |
          python tools/generate_schema.py

      - name: Verify schema is up to date
        run: |
          git diff --exit-code schemas/pipeline-config.schema.json
