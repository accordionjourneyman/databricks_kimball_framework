bundle:
  name: kimball-framework

variables:
  catalog:
    description: "Unity Catalog name for test schemas"
    default: "workspace"
  schema:
    description: "Default schema for ETL control tables"
    default: "kimball"

artifacts:
  python_wheel:
    type: whl
    path: dist

resources:
  jobs:
    kimball_integration_tests:
      name: "[${bundle.target}] kimball-integration-tests"
      description: "Run integration and benchmark tests for the Kimball Framework"
      max_concurrent_runs: 1
      tasks:
        - task_key: warmup
          description: "Pay cold-start cost so shard tasks reuse the warm session"
          environment_key: test_env
          spark_python_task:
            python_file: warmup.py
          timeout_seconds: 600

        - task_key: scd_shard
          description: "SCD core tests"
          depends_on:
            - task_key: warmup
          environment_key: test_env
          spark_python_task:
            python_file: run_tests.py
            parameters:
              - "--shard"
              - "scd"
              - "{{job.parameters.catalog || 'spark_catalog'}}"
          timeout_seconds: 1800

        - task_key: services_shard
          description: "Framework service tests"
          depends_on:
            - task_key: warmup
          environment_key: test_env
          spark_python_task:
            python_file: run_tests.py
            parameters:
              - "--shard"
              - "services"
              - "{{job.parameters.catalog || 'spark_catalog'}}"
          timeout_seconds: 1800

        - task_key: datasets_shard
          description: "Full dataset + benchmark tests"
          depends_on:
            - task_key: warmup
          environment_key: test_env
          spark_python_task:
            python_file: run_tests.py
            parameters:
              - "--shard"
              - "datasets"
              - "{{job.parameters.catalog || 'spark_catalog'}}"
          timeout_seconds: 1800

      environments:
        - environment_key: test_env
          spec:
            environment_version: "5"
            dependencies:
              - dist/*.whl
              - pytest

      parameters:
        - name: catalog
          default: "spark_catalog"
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: "UTC"

targets:
  dev:
    default: true
    mode: development

  test:
    mode: development

  prod:
    mode: production
